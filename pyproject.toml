[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-jira-mcp"
version = "0.1.16"
description = "A policy-controlled MCP server for Jira and Confluence Cloud and Data Center / Server."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3.0,<3.0.0",
    "httpx>=0.27.0,<1.0",
    "httpcore>=1.0.0,<2.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.5.0",
    "truststore>=0.10.0",
    "uvicorn>=0.30.0,<1.0",
]

[project.scripts]
secure-jira-mcp = "secure_jira_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
