[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-jira-mcp"
version = "0.1.0"
description = "A small, policy-controlled MCP server for Jira Data Center / Server with human confirmation for every change."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3.0,<3.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.5.0",
    "truststore>=0.10.0",
]

[project.scripts]
secure-jira-mcp = "secure_jira_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
